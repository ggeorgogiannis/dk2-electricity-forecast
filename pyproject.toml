[project]
name = "dk2-forecast"
version = "0.1.0"
description = "Reproducible DK2 quarter-hour electricity price forecasting and temporal evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost==1.2.8",
    "duckdb==1.5.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "lightgbm==4.6.0",
    "matplotlib==3.11.2",
    "numpy==2.2.6",
    "optuna==4.5.0",
    "pytz==2026.1",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "threadpoolctl==3.8.0",
    "tzdata==2026.2",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.14"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dk2_forecast*"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
